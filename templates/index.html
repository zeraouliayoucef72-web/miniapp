<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحصول على كود </title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 50px auto auto auto;
            background: #151f32;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        .logo {
            font-size: 50px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 22px;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s ease;
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.4);
        }
        .btn:hover {
            transform: scale(1.02);
        }
        .btn:disabled {
            background: #1e293b;
            color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
        }
        .code-box {
            display: none;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
            white-space: pre-line;
            font-family: monospace;
            font-size: 14px;
            color: #34d399;
            direction: ltr;
        }
        .btn-copy {
            display: none;
            background: #10b981;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">📺</div>
        <h1>xtream generator</h1>
        <p>شاهد الإعلان بالكامل للحصول على كود المشاهدة الخاص بك</p>

        <button class="btn" id="adBtn" onclick="showRewardedAd()" disabled>⏳ جاري تجهيز الإعلان...</button>

        <div class="code-box" id="codeBox"></div>
        <button class="btn btn-copy" id="copyBtn" onclick="copyCode()">📋 نسخ الكود الكامل</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const adBtn = document.getElementById('adBtn');
        const codeBox = document.getElementById('codeBox');
        const copyBtn = document.getElementById('copyBtn');

        const userId = tg.initDataUnsafe?.user?.id || "123456789";

        // 1. تحميل الـ SDK المخصص للتليجرام برابط آمن وصريح
        function injectMonetagSDK() {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = "https://libtl.com/sdk.js"; 
                script.setAttribute('data-zone', '11214314');
                script.setAttribute('data-sdk', 'show_11214314');
                script.async = true;

                script.onload = () => resolve();
                script.onerror = () => reject();

                document.head.appendChild(script);
            });
        }

        // 2. الفحص الذكي لتواجد الدالة وتفعيل الزر تلقائياً
        injectMonetagSDK().then(() => {
            let attempts = 0;
            const checkInterval = setInterval(() => {
                attempts++;
                
                if (typeof window.show_11214314 === 'function') {
                    clearInterval(checkInterval);
                    adBtn.innerText = "🎥 شاهد الإعلان للحصول على كود";
                    adBtn.disabled = false; 
                } else if (attempts > 30) {
                    clearInterval(checkInterval);
                    adBtn.innerText = "⚠️ افتح البوت داخل تطبيق تليجرام الرسمي";
                    console.error("Monetag SDK initialization timeout.");
                }
            }, 100);
        }).catch(() => {
            adBtn.innerText = "❌ فشل اتصال الإعلانات (تحقق من الـ AdBlocker)";
        });

        // 3. دالة استدعاء الإعلان عند الضغط
        function showRewardedAd() {
            if (typeof window.show_11214314 === 'function') {
                adBtn.disabled = true;
                adBtn.innerText = "جاري عرض الإعلان...";

                window.show_11214314()
                    .then(() => {
                        fetchCodeFromServer(true);
                    })
                    .catch((err) => {
                        alert("يجب مشاهدة الإعلان بالكامل للحصول على الكود.");
                        adBtn.disabled = false;
                        adBtn.innerText = "🎥 شاهد الإعلان للحصول على كود";
                        console.error(err);
                    });
            }
        }

        // 4. جلب الكود من Flask بنجاح
        function fetchCodeFromServer(isAdDone) {
            adBtn.innerText = "🔄 جاري جلب كود الـ IPTV...";
            
            fetch('/get_code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    telegram_id: userId.toString(),
                    ad_completed: isAdDone
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.code) {
                    codeBox.innerText = data.code;
                    codeBox.style.display = 'block';
                    copyBtn.style.display = 'block';
                    adBtn.style.display = 'none';
                } else {
                    alert(data.error || "حدث خطأ أثناء جلب الكود.");
                    adBtn.disabled = false;
                    adBtn.innerText = "🎥 شاهد الإعلان للحصول على كود";
                }
            })
            .catch(err => {
                alert("خطأ في الاتصال بالسيرفر.");
                adBtn.disabled = false;
                adBtn.innerText = "🎥 شاهد الإعلان للحصول على كود";
            });
        }

        function copyCode() {
            const codeText = codeBox.innerText;
            navigator.clipboard.writeText(codeText).then(() => {
                alert("تم نسخ الكود بنجاح!");
            });
        }
    </script>
</body>
</html>
