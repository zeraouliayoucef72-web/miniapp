<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IPTV Premium Codes</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{

background:#0d1117;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

.card{

width:90%;
max-width:380px;

background:#161b22;

border-radius:20px;

padding:25px;

text-align:center;

box-shadow:0 0 20px rgba(0,0,0,.5);

}

.icon{

font-size:70px;

margin-bottom:20px;

}

h1{

color:white;

font-size:25px;

margin-bottom:15px;

}

p{

color:#b8b8b8;

line-height:28px;

margin-bottom:30px;

}

button{

width:100%;

padding:16px;

border:none;

border-radius:12px;

background:#238636;

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:active{

transform:scale(.96);

}

#result{

display:none;

margin-top:25px;

background:#0d1117;

padding:15px;

border-radius:10px;

color:#58a6ff;

white-space:pre-wrap;

word-break:break-word;

}

</style>

</head>

<body>

<div class="card">

<div class="icon">
🎁
</div>

<h1>

احصل على كود IPTV

</h1>

<p>

شاهد الإعلان كاملاً ثم اضغط على الزر للحصول على كود IPTV مجاني.

</p>

<button onclick="showCode()">

🎥 شاهد الإعلان

</button>

<div id="result"></div>

</div>

<script>

function showCode(){

document.getElementById("result").style.display="block";

document.getElementById("result").innerHTML=

`هنا سيظهر الكود بعد مشاهدة الإعلان`;

}

</script>

</body>
</html>
